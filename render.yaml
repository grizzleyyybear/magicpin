services:
  - type: web
    name: vera-bot
    runtime: docker
    region: singapore
    plan: free
    rootDir: bot
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: groq/llama-3.1-8b-instant
      - key: LLM_MODEL_REASONER
        value: groq/llama-3.1-8b-instant
      - key: LLM_MODEL_WRITER
        value: groq/llama-3.1-8b-instant
      - key: LLM_MODEL_RESPONDER
        value: groq/llama-3.1-8b-instant
      - key: TEAM_NAME
        value: grizzleyyybear
      - key: TEAM_MEMBERS
        value: Mrinal Sharma
      - key: CONTACT_EMAIL
        value: mrinalsharmajune13@gmail.com
      - key: BOT_VERSION
        value: "1.0.0"
      - key: LOG_LEVEL
        value: INFO
